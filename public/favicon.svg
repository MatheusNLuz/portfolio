<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo escuro premium (slate-900) com cantos arredondados -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Iniciais ML em fonte robusta, alinhadas ao centro -->
  <text x="50%" y="54%" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">ML</text>
  
  <!-- Detalhe da marca (cyan accent) no canto superior direito -->
  <circle cx="80" cy="20" r="8" fill="#0ea5e9" />
</svg>
